<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cute Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="url(#g1)" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="9" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
          <circle cx="16" cy="16" r="3.5" fill="url(#g1)"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#a78bfa"/>
              <stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <strong>Cute Scraper</strong>
        <span>paste · scrape · ship</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="ghost-btn" id="historyBtn">History</button>
      <a class="ghost-btn" href="https://github.com" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Paste a link.<br/>Get clean data.</h1>
      <p>Point it at any page. Cute Scraper auto-detects the layout, handles JavaScript-heavy sites, follows pagination, and hands you a tidy CSV and JSON.</p>
    </section>

    <section class="panel">
      <form id="scrapeForm" class="scrape-form">
        <div class="input-row">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <input id="url" type="url" placeholder="https://example.com/products" required autocomplete="off" spellcheck="false" />
          </div>
          <button type="submit" id="scrapeBtn">
            <span class="btn-label">Scrape</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <div class="options">
          <label class="opt">
            <span>Mode</span>
            <select id="mode">
              <option value="auto">Auto-detect</option>
              <option value="static">Static (fast)</option>
              <option value="dynamic">Dynamic (JS)</option>
            </select>
          </label>
          <label class="opt">
            <span>Max pages</span>
            <input id="maxPages" type="number" min="1" max="200" value="5" />
          </label>
        </div>
      </form>

      <div class="status" id="status" hidden>
        <div class="status-head">
          <div class="spinner" id="spinner"></div>
          <span id="statusText">Idle</span>
        </div>
        <div class="log" id="log"></div>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-head">
          <div>
            <strong id="resultRows">0</strong>
            <span>rows · <span id="resultMode">auto</span></span>
          </div>
          <div class="result-actions">
            <button class="ghost-btn" id="copyJson">Copy JSON</button>
            <a class="primary-btn" id="dlCsv" href="#" download>Download CSV</a>
            <a class="primary-btn" id="dlJson" href="#" download>Download JSON</a>
          </div>
        </div>
        <div class="preview" id="preview"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="historyModal" hidden>
    <div class="modal-inner">
      <div class="modal-head">
        <strong>Recent jobs</strong>
        <button class="ghost-btn" id="closeHistory">Close</button>
      </div>
      <div class="history" id="historyList"></div>
    </div>
  </div>

<script src="/static/app.js"></script>
</body>
</html>
